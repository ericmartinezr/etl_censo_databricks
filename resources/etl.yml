resources:
  jobs:
    ETL_Censo:
      name: ETL_Censo
      email_notifications:
        on_failure:
          - ***REMOVED***
        no_alert_for_skipped_runs: true
      notification_settings:
        no_alert_for_skipped_runs: true
        no_alert_for_canceled_runs: true
      tasks:
        - task_key: Create_Tables
          notebook_task:
            notebook_path: ${var.notebook_path}/01_Create_Tables
            source: WORKSPACE
          environment_key: Default
        - task_key: Init_Tables
          depends_on:
            - task_key: Create_Tables
          notebook_task:
            notebook_path: ${var.notebook_path}/02_Init_Tables
            source: WORKSPACE
        - task_key: Map_Codes
          depends_on:
            - task_key: Init_Tables
          notebook_task:
            notebook_path: ${var.notebook_path}/03_Map_Codes
            source: WORKSPACE
        - task_key: Resultado_Final
          depends_on:
            - task_key: Map_Codes
          notebook_task:
            notebook_path: ${var.notebook_path}/04_Resultado_Final
            source: WORKSPACE
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED

variables:
  notebook_path:
    default: "/Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}/files/notebooks"